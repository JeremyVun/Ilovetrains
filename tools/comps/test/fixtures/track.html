<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.className = /defect/.test(location.search) ? 'defect' : 'clean';</script>
<style>
  body { margin: 0; padding: 22px; background: #0A0B0D; color: #F4F5F7;
    font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sy-row { display: flex; align-items: baseline; }
  .fig { width: 80px; overflow: hidden; }
  .n { font: 700 44px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .u { font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sy-row.wide .n { font-size: 30px; }
  .defect .sy-row.wide .n { font-size: 44px; }
</style>
</head><body>
<div class="sy-row" data-lockup-row>
  <span class="fig" data-track="fig" data-lockups="78|999@wide"><span class="n" data-ink>78<span class="u" data-unit>min</span></span></span>
  <span class="sign">Gordon via Lindfield</span>
</div>
</body></html>
