<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<!-- Without this, Chrome lays this page out at 980px in mobile emulation and
     the icon renders at the wrong scale. See tools/screenshot.js trap 2. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App icon</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { height: 100%; background: #0A0B0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// The locked vector stays canonical; the canvas only applies platform scaling.
const BG = '#0A0B0D';
const q = new URLSearchParams(location.search);
const safe = q.has('safe') ? Number(q.get('safe')) : 1;
const S = Math.min(document.documentElement.clientWidth, document.documentElement.clientHeight);
const dpr = window.devicePixelRatio || 1;

const canvas = document.getElementById('c');
canvas.width = Math.round(S * dpr);
canvas.height = Math.round(S * dpr);
canvas.style.width = S + 'px';
canvas.style.height = S + 'px';

const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);
ctx.fillStyle = BG;
ctx.fillRect(0, 0, S, S);

const source = new Image();
source.addEventListener('load', () => {
  const side = S * safe;
  ctx.drawImage(source, (S - side) / 2, (S - side) / 2, side, side);
  document.documentElement.dataset.iconReady = 'true';
});
source.src = '../assets/brand/sleepers.svg';
</script>
</body>
</html>
