<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C1 · Platform block</title>
<link rel="stylesheet" href="base.css">
<style>
/* ============================================================ C1 · PLATFORM BLOCK
   Keeps the board's row grammar and answers the confusion by SPECIES:
   the minutes figure wears its unit (the `3H` lockup, promoted to every row) and
   the platform is lifted out of the meta line into a labelled block of its own at
   the right edge. Line colour is a full-height rail in the left margin of EVERY
   row, split where the journey changes trains.
   ================================================================================ */

.mast .tools { display: none; }          /* the word-buttons move to the thumb */
.mast .rule  { display: none; }          /* the NOW anchor is the heavy rule now */
.mast { padding-bottom: 12px; }
.mast .kicker .pred { color: var(--ink); }

/* ---- the now anchor: the board's one heavy rule, and it means "you are here" */
.now {
  flex: none; padding: 0 22px;
}
.now .rule { height: 2px; background: var(--ink); opacity: .82; }
.now .line {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 9px 0 10px;
  font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink);
}
.now .line .up { color: var(--ink-3); letter-spacing: .14em; }

/* ---- the timeline ---------------------------------------------------------- */
.tl {
  flex: 1; min-height: 0; padding: 0 22px;
  display: flex; flex-direction: column;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}

/* Past rows are a different substance: one dense line, clock times only, no
   figure, the colour rail drawn as a hairline outline rather than filled. */
.gone-row {
  flex: none; display: flex; align-items: baseline; gap: 10px;
  padding: 13px 0 13px 17px; border-bottom: 1px solid var(--rule);
  position: relative; color: var(--ink-3); font-size: 14px; font-weight: 300;
}
.gone-row::before {
  content: ''; position: absolute; left: 0; top: 15px; bottom: 15px; width: 6px;
  background: var(--stem); opacity: .32;
}
.gone-row .t { color: var(--ink-2); font-size: 16px; font-weight: 400; }
.gone-row .p { font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
  flex: none; white-space: nowrap; }
.gone-row .t { flex: none; }
.gone-row del { color: var(--ink-3); font-size: 13px; font-weight: 300; }
.gone-row.timetable .t { color: var(--ink-3); font-weight: 200; }
.gone-row.timetable::before { opacity: .16; }
.gone-row .r.warn { color: var(--warn); }
.gone-row .r { margin-left: auto; flex: none; padding-left: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }

/* ---- a future row ---------------------------------------------------------- */
.row2 {
  flex: none; position: relative;
  display: grid; grid-template-columns: 84px 1fr 46px; gap: 0 13px;
  align-items: start; padding: 17px 0 18px 15px;
  border-bottom: 1px solid var(--rule);
}
/* The rail: the line's colour, full row height, on EVERY row. Where the journey
   changes trains it is two segments — you ride red, then blue. */
.rail2 { position: absolute; left: 0; top: 13px; bottom: 14px; width: 6px;
  display: flex; flex-direction: column; }
.rail2 span { display: block; }

.f { text-align: right; padding-top: 1px; }
.f .n {
  font-size: 62px; font-weight: 250; letter-spacing: -.045em; line-height: .84;
  color: var(--ink);
}
/* THE MOVE: the unit is welded to the numeral, on its baseline, exactly the way
   ruling B sets the H in `3H`. A number wearing "min" is not a platform. */
.f .u { font-size: .23em; font-weight: 400; letter-spacing: .01em; padding-left: .06em; color: var(--ink-2); }
.f .prov {
  display: block; margin-top: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap;
}
.f .prov.warn { color: var(--warn); }

.row2.first .f .n { font-size: 78px; }
.row2.first { padding-top: 20px; padding-bottom: 22px; }
.row2.wide .f .n { font-size: 46px; }
.row2.first.wide .f .n { font-size: 52px; }

.b { min-width: 0; }
.b .dep { font-size: 21px; font-weight: 400; letter-spacing: -.01em; color: var(--ink);
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.b .dep del { color: var(--ink-3); font-size: 15px; font-weight: 300; }
.b .dep .to { color: var(--ink-3); font-size: 14px; font-weight: 300; }
.row2.first .b .dep { font-size: 23px; }
.b .via { margin-top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b .via i { font-style: normal; color: var(--stem); font-weight: 700; }
.b .via i.two { color: var(--stem2); }
.b .dest { margin-top: 7px; font-size: 14px; font-weight: 300; line-height: 19px;
  color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.endmk { flex: none; padding: 15px 0 0; font-size: 10px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.b .dest.note { font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--warn); }

/* ---- the platform block: the row's second figure, and it says what it is ---- */
.pf { text-align: right; padding-top: 3px; }
.pf .k { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); display: block; }
.pf .v { display: block; margin-top: 3px; font-size: 28px; font-weight: 400;
  letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.row2.first .pf .v { font-size: 32px; }
.pf .bar { display: block; height: 4px; margin-top: 6px; background: var(--stem); }

.row2.cx .f .n { font-size: 36px; color: var(--ink-3); font-weight: 200; }
.row2.first.cx .f .n { font-size: 36px; }
.row2.cx .f .u { display: none; }
.row2.cx .b .dep, .row2.cx .b .dest { color: var(--ink-3); }
.row2.cx .b .dep strong { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row2.cx .pf .v { color: var(--ink-3); }
.row2.cx .rail2 span { opacity: .3; }
.row2.late .f .n, .row2.late .b .dep > strong { color: var(--warn); }
.row2.sched .f .n { color: var(--ink-2); font-weight: 200; }

/* ---- the focused journey, riding above the nav (B2's band, unchanged idea) -- */
.strip { flex: none; padding: 10px 22px 0; border-top: 2px solid var(--ink); }
.strip .l1 { display: flex; align-items: baseline; gap: 10px; }
.strip .l1 .n { font-size: 34px; font-weight: 250; letter-spacing: -.04em; color: var(--ink); }
.strip .l1 .n .u { font-size: .3em; font-weight: 400; letter-spacing: .02em; color: var(--ink-2); }
.strip .l1 .t { font-size: 17px; color: var(--ink); }
.strip .l1 .d { font-size: 13px; font-weight: 300; color: var(--ink-3); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .l2 { margin-top: 5px; padding-bottom: 9px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.strip .l2 b { color: var(--ink-2); font-weight: 600; }

/* ---- the thumb band: every navigation the board owns, on the bottom edge ---- */
.nav {
  flex: none; display: flex; align-items: stretch;
  border-top: 2px solid var(--ink);
  padding: 0 22px max(10px, env(safe-area-inset-bottom, 0px));
}
.nav.thin { border-top-width: 1px; border-top-color: var(--rule-2); }
.nav button {
  display: flex; align-items: center; gap: 7px;
  min-height: 52px; padding: 0 2px;
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink);
}
.nav button .g { font-size: 15px; font-weight: 300; letter-spacing: 0; color: var(--ink-2); }
.nav .sp { flex: 1; }
.nav .mid { justify-content: center; }
.nav .frs { display: flex; align-items: center; gap: 7px; min-height: 52px;
  font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); }

/* ---- trips sheet: the predicted trip is printed above the rule -------------- */
.sh { flex: 1; min-height: 0; overflow-y: auto; padding: 0 22px;
      display: flex; flex-direction: column; }
.pred-hd { padding: 16px 0 0; }
.pred-hd .k { font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.tripr { display: grid; grid-template-columns: 5px 1fr auto; gap: 0 14px;
  align-items: center; padding: 17px 0 18px; border-bottom: 1px solid var(--rule); }
.tripr .c { align-self: stretch; background: var(--stem); }
.tripr .nm { font-size: 21px; font-weight: 300; letter-spacing: -.015em; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tripr .nm em { font-style: normal; color: var(--ink-3); font-weight: 200; padding: 0 3px; }
.tripr .sub { margin-top: 6px; font-size: 10px; font-weight: 600; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); }
.tripr .go { font-size: 17px; font-weight: 400; color: var(--ink-2); }
.tripr.top { border-bottom: 2px solid var(--ink); padding-top: 10px; padding-bottom: 20px; }
.tripr.top .nm { font-size: 23px; }
.tripr.top .sub { color: var(--ink-2); }
.sh .k2 { padding: 16px 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3); }
.tripr .ed { font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); padding: 16px 0 16px 16px; }

/* ---- the permission ask: a band, printed in place, not a dialog ------------- */
.ask { flex: none; padding: 18px 22px 0; border-top: 2px solid var(--ink); }
.ask .k { font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3); }
.ask p { margin-top: 10px; font-size: 16px; font-weight: 300; line-height: 1.45; color: var(--ink); }
.ask .acts { display: flex; gap: 26px; margin-top: 4px; }
.ask .acts button { min-height: 52px; font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.ask .acts button.q { color: var(--ink-3); }
</style>
</head>
<body><div id="app"></div>
<script src="data.js"></script>
<script>
(function () {
  var m = model(scenarioName());
  var app = document.getElementById('app');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function railFor(r) {
    if (!r.line2) return '<span style="flex:1;background:var(--stem)"></span>';
    /* two segments: the T9 leg is 27 min, the T4 leg 10 min — the split is the
       real ride split, so the rail is information, not decoration. */
    return '<span style="flex:27;background:var(--stem)"></span>'
         + '<span style="flex:10;background:var(--stem2)"></span>';
  }

  function mast() {
    return '<div class="mast">'
      + '<div class="kicker"><span class="pulse live"></span>'
      + '<span class="lbl pred">Nearest &middot; ' + esc(m.from) + '</span></div>'
      + '<h1>' + esc(m.from) + ' <em>&rarr;</em> ' + esc(m.to) + '</h1>'
      + '</div>';
  }
  function nowAnchor() {
    return '<div class="now"><div class="rule"></div><div class="line">'
      + '<span>Now &middot; ' + m.now + '</span>'
      + '<span class="up">&uarr; ' + 'Earlier' + '</span></div></div>';
  }
  /* Two past registers. An ACTUALS row prints what happened — the time it really
     left, the timetabled time struck if they differ, and how late that was. A
     TIMETABLE-ONLY row prints the timetable and makes no claim: its figures are
     set in the SCHEDULED idiom (lighter, ink-3), which is already the house's
     way of saying "nothing has confirmed this". */
  function pastRow(r) {
    return '<div data-svc data-past class="gone-row ' + r.pastKind + '" style="--stem:var(--line-' + r.line + ')">'
      + '<span class="t">' + r.pastDep + '</span>'
      + (r.pastStruck ? '<del>' + r.pastStruck + '</del>' : '')
      + '<span class="p">Plat ' + r.plat + ' &middot; ' + r.line + (r.line2 ? ' ' + r.line2 : '') + '</span>'
      /* No elapsed marker: the now anchor at the foot of the past states the
         reference clock, so "46 min ago" beside 09:56 is arithmetic the page has
         already done. The right column carries the REGISTER instead. */
      + '<span class="r' + (r.lateBy && r.pastKind === 'actual' ? ' warn' : '') + '">'
      + (r.pastKind === 'actual' ? (r.lateBy ? r.lateBy + ' min late' : 'On time')
                                 : 'Timetable only') + '</span></div>';
  }
  function futureRow(r, first, note) {
    var cls = 'row2' + (first ? ' first' : '') + (r.cx ? ' cx' : '')
      + (r.lateBy ? ' late' : '') + (r.sched ? ' sched' : '')
      + (r.fig.length > 2 ? ' wide' : '');
    var third = note ? '<div class="dest note">' + note + '</div>'
      : '<div class="dest">' + esc(r.head) + '</div>';
    return '<div data-svc class="' + cls + '" style="--stem:var(--line-' + r.line + ');--stem2:var(--line-'
      + (r.line2 || r.line) + ')">'
      + '<div class="rail2">' + railFor(r) + '</div>'
      + '<div class="f"><span class="n">' + r.fig
      + (r.cx || r.fig === 'Now' ? '' : '<span class="u">min</span>') + '</span>'
      + '<span class="prov' + (r.cx || r.lateBy ? ' warn' : '') + '">' + r.state + '</span></div>'
      + '<div class="b"><div class="dep"><strong>' + r.dep + '</strong>'
      + (r.planned ? '<del>' + r.planned + '</del>' : '')
      + '<span class="to">arrives ' + r.arr + '</span></div>'
      + '<div class="via"><i>' + r.line + '</i>' + (r.line2 ? ' <span style="color:var(--ink-3)">&rarr;</span> <i class="two">' + r.line2 + '</i> &middot; 1 change' : '') + '</div>'
      + third + '</div>'
      + '<div class="pf"><span class="k">Platform</span><span class="v">' + r.plat + '</span>'
      + '<span class="bar"></span></div>'
      + '</div>';
  }

  function board() {
    var note = null;
    if (m.rows[0] && m.rows[0].cx) note = m.rows[0].dep + ' cancelled &middot; next train';
    var past = m.past.map(pastRow).join('');
    var fut = m.next.map(function (r, i) {
      return futureRow(r, i === 0, i === 1 ? note : null);
    }).join('');
    var strip = m.focus ? ('<div class="strip">'
      + '<div class="l1"><span class="n">47<span class="u">min</span></span>'
      + '<span class="t">10:08</span><span class="d">you arrive Bondi Junction</span></div>'
      + '<div class="l2">On the <b>09:24</b> &middot; change Town Hall <b>09:58</b> &middot; Platform 5</div>'
      + '</div>') : '';
    /* The anchor is one object in two positions. Unscrolled it sits directly
       under the masthead and IS the masthead's heavy rule (the old one is gone —
       subtraction, not addition). Scrolled, the past has opened above it and it
       has travelled down the page with the present. */
    var anchor = nowAnchor().replace('class="now"', 'class="now" style="margin:0;padding:0"');
    return mast()
      + (m.scrolled
          ? '<div class="now"><div class="rule"></div></div>'
          : '')
      + '<div class="tl">'
      + (m.scrolled ? past : '')
      + anchor
      + fut
      + '<div class="endmk">&mdash; end of board</div>'
      + '</div>'
      + strip
      + '<div class="nav' + (m.focus ? ' thin' : '') + '">'
      + '<button><span class="g">&#8646;</span>Reverse</button>'
      + (m.scrolled
          ? '<span class="sp"></span><button class="mid"><span class="g">&darr;</span>Now</button><span class="sp"></span>'
          : '<span class="sp"></span>')
      + '<button>Trips</button>'
      + '</div>';
  }

  /* the now anchor lives INSIDE the scroller when there is a past above it */
  function boardScrolled() { return board(); }

  function trips() {
    var t = TRIPS;
    return '<div class="mast"><div class="kicker"><span class="pulse live"></span>'
      + '<span class="lbl">Your trips</span></div><h1>Trips</h1></div>'
      + '<div class="sh">'
      + '<div class="pred-hd"><span class="k"><span class="pulse live"></span>Nearest you &middot; ' + t[0].dist + '</span></div>'
      + '<div class="tripr top" style="--stem:var(--line-' + t[0].line + ')"><span class="c"></span>'
      + '<div><div class="nm">' + t[0].from + ' <em>&rarr;</em> ' + t[0].to + '</div>'
      + '<div class="sub">' + t[0].line + ' &middot; next train ' + t[0].next + '</div></div>'
      + '<span class="ed">Edit</span></div>'
      + '<div class="k2">All trips</div>'
      + t.slice(1).map(function (x) {
        return '<div class="tripr" style="--stem:var(--line-' + x.line + ')"><span class="c"></span>'
          + '<div><div class="nm">' + x.from + ' <em>&rarr;</em> ' + x.to + '</div>'
          + '<div class="sub">' + x.line + ' &middot; ' + x.dist + ' away &middot; ' + x.next + '</div></div>'
          + '<span class="ed">Edit</span></div>';
      }).join('')
      + '</div>'
      + '<div class="nav"><button><span class="g">&larr;</span>Board</button>'
      + '<span class="sp"></span><button>New trip</button></div>';
  }

  function ask() {
    var b = board();
    return b.replace('<div class="nav',
      '<div class="ask"><span class="k">Open on the right trip</span>'
      + '<p>You have three trips saved. If the app can see where you are, it opens on the one you are standing near.</p>'
      + '<div class="acts"><button>Use my location</button><button class="q">Not now</button></div></div>'
      + '<div class="nav" style="display:none"');
  }

  app.innerHTML = m.screen === 'trips' ? trips() : m.screen === 'ask' ? ask() : board();

  /* the board opens anchored at NOW: the scroller starts at the top of the
     future, never inside the past. When scrolled, the past sits above. */
  var tl = document.querySelector('.tl');
  if (tl && !m.scrolled) tl.scrollTop = 0;
})();
</script>
</body></html>
