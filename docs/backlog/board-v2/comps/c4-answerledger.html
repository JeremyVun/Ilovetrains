<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C4 · Answer &amp; ledger</title>
<link rel="stylesheet" href="base.css">
<style>
/* ========================================================= C4 · ANSWER + LEDGER
   Re-litigates the row grammar. Six equal three-line rows spend the whole frame
   restating a question the user asked once, so this direction splits the board in
   two: ONE ANSWER at the top — the train you are actually catching, set as a pair
   of equally large, equally labelled figures, MIN and PLATFORM side by side under
   one rule — and everything else as a one-line ledger beneath it.
   Complaint 2 is answered by symmetry rather than by species: you cannot mistake
   the big number for the platform when the platform is the other big number and
   both are named. Nothing else on the board carries a big number at all.
   Complaint 3 is answered by the roundel: a filled chip in the line's colour with
   the line's code knocked out, which is the mark on every sign in the network,
   plus a full-measure colour band closing the answer.
   The ledger's density is what pays for everything else: eight services fit where
   six used to, which is what makes a scrollable past affordable.
   ================================================================================ */

.mast { padding: 20px 22px 0; }
.mast .tools, .mast .rule { display: none; }

/* ---- the answer ------------------------------------------------------------ */
.ans { flex: none; padding: 0 22px; }
.ans .hd {
  display: flex; align-items: baseline; justify-content: space-between;
  border-top: 2px solid var(--ink); padding: 10px 0 0;
  font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink);
}
.ans .hd .up { color: var(--ink-3); letter-spacing: .14em; }
.ans .pair { display: flex; align-items: flex-start; gap: 0; padding: 6px 0 0; }
.ans .cell { flex: 1; min-width: 0; }
.ans .cell + .cell { border-left: 1px solid var(--rule-2); padding-left: 18px; }
.ans .cell .k {
  display: block; font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px;
}
.ans .cell .v {
  display: block; font-size: 84px; font-weight: 250; letter-spacing: -.05em;
  line-height: 1.02; color: var(--ink);
}
.ans .cell .v .u { font-size: .26em; font-weight: 400; letter-spacing: .01em;
  padding-left: .07em; color: var(--ink-2); }
.ans.wide .cell .v { font-size: 62px; }
.ans .cell .s {
  display: block; margin-top: 4px; font-size: 13px; font-weight: 300; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ans .cell .s.warn { color: var(--warn); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; }
.ans.late .cell:first-child .v { color: var(--warn); }
.ans.sched .cell:first-child .v { color: var(--ink-2); font-weight: 200; }
.ans.cx .cell .v { color: var(--ink-3); font-weight: 200; font-size: 52px; }

.ans .line {
  margin-top: 12px; font-size: 15px; font-weight: 300; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ans .line b { color: var(--ink); font-weight: 400; }
.ans .cxnote { margin-top: 7px; font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--warn); }
.ans .line2 { margin-top: 5px; font-size: 14px; font-weight: 300; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ans .line del { color: var(--ink-3); }
/* the closing band: the journey's lines, in ride order, at full measure */
.ans .band { display: flex; height: 7px; margin-top: 13px; }
.ans .band span { display: block; }
.ans.cx .band span { opacity: .3; }

/* ---- the ledger ------------------------------------------------------------ */
.led {
  flex: 1; min-height: 0; padding: 0 22px;
  display: flex; flex-direction: column;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
.led .kick { flex: none; padding: 13px 0 3px; font-size: 10px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.led-row {
  flex: none; display: grid; grid-template-columns: 96px 62px 1fr auto; gap: 0 11px;
  align-items: center; min-height: 46px; padding: 4px 0 5px;
  border-bottom: 1px solid var(--rule);
}
.led-row .t { font-size: 18px; font-weight: 400; letter-spacing: -.015em; color: var(--ink); }
.pill { display: flex; height: 21px; border-radius: 11px; overflow: hidden; }
.pill .h { flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 0 5px; }
.pill .h.a { background: var(--stem); color: var(--on-stem); }
.pill .h.b { background: var(--stem2); color: var(--on-stem2); }
.led-row .p { font-size: 12px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.led-row .p b { color: var(--ink-2); font-weight: 600; }
.led-row .m { font-size: 19px; font-weight: 400; color: var(--ink); text-align: right;
  white-space: nowrap; }
.led-row .m .u { font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); padding-left: 4px; }
.led-row.sched .t, .led-row.sched .m { color: var(--ink-2); font-weight: 300; }
.led-row.late .t, .led-row.late .m { color: var(--warn); }
.led-row.cx .t { color: var(--ink-3); text-decoration: line-through;
  text-decoration-thickness: 1.5px; }
.led-row.cx .m { font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--warn); }
.led-row.cx .pill { opacity: .35; }

/* past: same ledger line, receded, and the register is stated in the last slot */
.led-row.gone .t { color: var(--ink-2); }
.led-row.gone.timetable .t { color: var(--ink-3); font-weight: 300; }
.led-row.gone .pill { opacity: .4; }
.led-row.gone.timetable .pill { opacity: .22; }
.led-row.gone .m { font-size: 10px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); }
.led-row.gone.actual.late .m { color: var(--warn); }
.led-row.gone del { color: var(--ink-3); font-size: 13px; font-weight: 300; padding-left: 6px; }
.led-row .t { white-space: nowrap; }

.nowbar {
  flex: none; display: flex; align-items: baseline; justify-content: space-between;
  border-top: 2px solid var(--ink); padding: 9px 0 2px;
  font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink);
}
.nowbar .up { color: var(--ink-3); letter-spacing: .14em; }
.endmk { flex: none; padding: 13px 0 0; font-size: 10px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

/* ---- focused strip + thumb bar --------------------------------------------- */
.strip { flex: none; padding: 10px 22px 10px; border-top: 1px solid var(--rule-2);
  display: flex; align-items: baseline; gap: 10px; }
.strip .v { font-size: 26px; font-weight: 250; letter-spacing: -.04em; color: var(--ink); }
.strip .v .u { font-size: .32em; font-weight: 400; color: var(--ink-2); padding-left: .07em; }
.strip .d { font-size: 13px; font-weight: 300; color: var(--ink-3); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .d b { color: var(--ink-2); font-weight: 400; }

.bar {
  flex: none; display: flex; align-items: stretch; border-top: 2px solid var(--ink);
  padding: 0 22px max(8px, env(safe-area-inset-bottom, 0px));
}
.bar button {
  display: flex; align-items: center; gap: 7px; min-height: 54px;
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink);
}
.bar button .g { font-size: 16px; font-weight: 300; letter-spacing: 0; color: var(--ink-2); }
.bar .sp { flex: 1; }

/* ---- trips + ask ------------------------------------------------------------ */
.sh { flex: 1; min-height: 0; overflow-y: auto; padding: 0 22px;
      display: flex; flex-direction: column; }
.hd2 { padding: 16px 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.hd2.q { color: var(--ink-3); padding-top: 20px; }
.tripr { display: grid; grid-template-columns: 34px 1fr auto; gap: 0 14px; align-items: center;
  padding: 13px 0 14px; border-bottom: 1px solid var(--rule); }
.tripr .rd { width: 30px; height: 20px; border-radius: 10px; background: var(--stem);
  color: var(--on-stem); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.tripr .nm { font-size: 20px; font-weight: 300; letter-spacing: -.015em; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tripr .nm em { font-style: normal; color: var(--ink-3); font-weight: 200; padding: 0 3px; }
.tripr .sub { margin-top: 5px; font-size: 10px; font-weight: 600; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); }
.tripr.top { border-bottom: 2px solid var(--ink); padding: 8px 0 17px; }
.tripr.top .nm { font-size: 23px; }
.tripr.top .sub { color: var(--ink-2); }
.tripr .ed { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); padding: 16px 0 16px 14px; white-space: nowrap; }
.tripr > div:nth-child(2) { min-width: 0; }

.ask { flex: none; padding: 16px 22px 0; border-top: 2px solid var(--ink); }
.ask .k { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); }
.ask p { margin-top: 10px; font-size: 16px; font-weight: 300; line-height: 1.45; color: var(--ink); }
.ask .acts { display: flex; gap: 26px; margin-top: 2px;
  padding-bottom: max(4px, env(safe-area-inset-bottom, 0px)); }
.ask .acts button { min-height: 52px; font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.ask .acts button.q { color: var(--ink-3); }

/* MEASURED, and it does not carry over between schemes. On the dark ground the
   knocked-out ink has to be chosen per line (white on T1 is 1.95:1; black on T4
   is 2.80:1), which is why INK_ON exists. On PAPER every one of the darkened
   light-scheme line values was already tuned to clear 4.5:1 against #FAF9F5, so
   the correct ink there is the ground, for every line, with no table. Carrying
   the dark table into light printed near-black on red at 3.52:1 — caught in
   c4-answerledger-390x844-hero-light.png, not by reading the CSS. */
@media (prefers-color-scheme: light) {
  .pill .h { color: var(--bg) !important; }
}
</style>
</head>
<body><div id="app"></div>
<script src="data.js"></script>
<script>
(function () {
  var m = model(scenarioName());
  var app = document.getElementById('app');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  /* A filled roundel carries LARGE type only. Measured against #F4F5F7 and
     #0A0B0D: white loses on T1/T2/T3/T7/T8/M1 (T1 white is 1.95:1), wins on
     T4/T5/T9/HUN. The chip's ink is therefore chosen per line, not fixed —
     a deliberate divergence from TfNSW's own always-white roundels. */
  var INK_ON = { T1: 'bg', T2: 'bg', T3: 'bg', T7: 'bg', T8: 'bg', M1: 'bg',
                 BMT: 'bg', SCO: 'bg', SHL: 'bg',
                 T4: 'ink', T5: 'ink', T9: 'ink', CCN: 'ink', HUN: 'ink' };
  function vars(r) {
    var a = r.line, b = r.line2 || r.line;
    return '--stem:var(--line-' + a + ');--stem2:var(--line-' + b + ');'
      + '--on-stem:var(--' + (INK_ON[a] === 'ink' ? 'ink' : 'bg') + ');'
      + '--on-stem2:var(--' + (INK_ON[b] === 'ink' ? 'ink' : 'bg') + ')';
  }
  /* Two discs overlapping ate the first code. One pill, split: you ride the red
     line, then the blue one, left to right in ride order. */
  function roundels(r) {
    return '<div class="pill">'
      + '<span class="h a">' + r.line + '</span>'
      + (r.line2 ? '<span class="h b">' + r.line2 + '</span>' : '') + '</div>';
  }

  /* ---- THE ANSWER: two figures, same size, each named --------------------- */
  function answer(r) {
    var cls = 'ans' + (r.cx ? ' cx' : '') + (r.lateBy ? ' late' : '') + (r.sched ? ' sched' : '')
      + (r.fig.length > 2 ? ' wide' : '');
    var left = r.cx
      ? '<span class="v">&mdash;</span><span class="s warn">Cancelled</span>'
      : '<span class="v">' + r.fig + (r.fig === 'Now' ? '' : '<span class="u">min</span>')
        + '</span><span class="s' + (r.lateBy ? ' warn' : '') + '">'
        + (r.lateBy ? r.lateBy + ' min late' : r.sched ? 'scheduled only' : 'running on time') + '</span>';
    return '<div class="' + cls + '" style="' + vars(r) + '">'
      + '<div class="hd"><span>Next train &middot; ' + m.now + '</span>'
      + '<span class="up">&uarr; Earlier</span></div>'
      + '<div class="pair">'
      + '<div class="cell"><span class="k">Minutes</span>' + left + '</div>'
      + '<div class="cell"><span class="k">Platform</span><span class="v">' + r.plat + '</span>'
      + '<span class="s">at ' + esc(m.from) + '</span></div>'
      + '</div>'
      + '<div class="line"><b>' + r.dep + '</b>'
      + (r.planned ? ' <del>' + r.planned + '</del>' : '')
      + ' &rarr; arrives ' + r.arr
      + (r.line2 ? ' &middot; change at ' + r.chg.at : '') + '</div>'
      + '<div class="line2">' + esc(r.head) + '</div>'
      + (r.cxNote ? '<div class="cxnote">' + r.cxNote + ' &middot; this is the next train</div>' : '')
      + (r.line2
          ? '<div class="band"><span style="flex:27;background:var(--stem)"></span>'
            + '<span style="flex:10;background:var(--stem2)"></span></div>'
          : '<div class="band"><span style="flex:1;background:var(--stem)"></span></div>')
      + '</div>';
  }

  /* ---- the ledger: one line per service, past and future ------------------ */
  function led(r, note) {
    var cls = 'led-row' + (r.past ? ' gone ' + r.pastKind : '') + (r.cx ? ' cx' : '')
      + (r.lateBy && r.pastKind !== 'timetable' ? ' late' : '') + (r.sched && !r.past ? ' sched' : '');
    var right = r.past
      ? (r.pastKind === 'actual' ? (r.lateBy ? r.lateBy + ' min late' : 'On time') : 'Timetable only')
      : r.cx ? 'Cancelled'
      : r.fig === 'Now' ? '<span class="u">Departing</span>'
      : r.fig + '<span class="u">min</span>';
    return '<div data-svc ' + (r.past ? 'data-past ' : '') + 'class="' + cls + '" style="' + vars(r) + '">'
      + '<span class="t">' + (r.past ? r.pastDep : r.dep)
      + ((r.past ? r.pastStruck : r.planned) ? '<del>' + (r.past ? r.pastStruck : r.planned) + '</del>' : '')
      + '</span>'
      + roundels(r)
      /* A past row does not carry its platform: you are not catching that train,
         and the register word in the last column is the only thing on the line
         a reader can still use. */
      + '<span class="p">' + (r.past ? '' : 'Plat <b>' + r.plat + '</b>'
          + (r.cx ? '' : ' &middot; ' + r.arr)) + '</span>'
      + '<span class="m">' + right + '</span></div>';
  }

  function board() {
    /* "Cancelled lead never silently skips" (owner ruling) meets "the answer is
       the next train you can actually catch". A cancelled service is not an
       answer, so the ANSWER block takes the next RUNNING one and says so in the
       coral line; the cancelled service keeps its place in the ledger, struck,
       so nothing is hidden. This is the one place C4 must differ from the
       shipped board, whose first ROW is allowed to be the cancelled one. */
    var running = m.next.filter(function (r) { return !r.cx; });
    var lead = running[0] || m.next[0] || m.rows[m.rows.length - 1];
    var skipped = m.next.filter(function (r) { return r.cx && r.i < lead.i; });
    var rest = m.next.filter(function (r) { return r !== lead; });
    var note = skipped.length ? skipped[0].dep + ' cancelled' : null;
    lead = Object.assign({}, lead, { cxNote: note });
    var out = '<div class="mast"><div class="kicker"><span class="pulse live"></span>'
      + '<span class="lbl" style="color:var(--ink)">Nearest &middot; ' + esc(m.from) + '</span></div>'
      + '<h1>' + esc(m.from) + ' <em>&rarr;</em> ' + esc(m.to) + '</h1></div>';
    if (!m.scrolled) out += answer(lead);
    out += '<div class="led">';
    if (m.scrolled) {
      out += m.past.map(function (r) { return led(r, null); }).join('');
      out += '<div class="nowbar"><span>Now &middot; ' + m.now + '</span>'
        + '<span class="up">&uarr; Earlier</span></div>';
      out += m.next.map(function (r, i) { return led(r, i === 1 ? note : null); }).join('');
    } else {
      out += '<div class="kick">Then</div>'
        + rest.map(function (r) { return led(r, null); }).join('');
    }
    out += '<div class="endmk">&mdash; end of board</div></div>';
    var strip = m.focus ? ('<div class="strip"><span class="v">47<span class="u">min</span></span>'
      + '<span class="d">to <b>Bondi Junction 10:08</b> &middot; change 09:58 plat 5</span>'
      + '</div>') : '';
    return out + strip
      + '<div class="bar"><button><span class="g">&#8646;</span>Reverse</button><span class="sp"></span>'
      + (m.scrolled ? '<button><span class="g">&darr;</span>Now</button><span class="sp"></span>' : '')
      + '<button>Trips</button></div>';
  }

  function trips() {
    var t = TRIPS;
    function row(x, top) {
      return '<div class="tripr' + (top ? ' top' : '') + '" style="--stem:var(--line-' + x.line
        + ');--on-stem:var(--' + (INK_ON[x.line] === 'ink' ? 'ink' : 'bg') + ')">'
        + '<span class="rd">' + x.line + '</span>'
        + '<div><div class="nm">' + x.from + ' <em>&rarr;</em> ' + x.to + '</div>'
        + '<div class="sub">' + (top ? '120 m away &middot; next train ' + x.next
            : x.dist + ' away &middot; next ' + x.next) + '</div></div>'
        + '<span class="ed">Edit</span></div>';
    }
    return '<div class="mast"><div class="kicker"><span class="lbl">3 trips on this phone</span></div>'
      + '<h1>Trips</h1></div><div class="sh">'
      + '<div class="hd2"><span class="pulse live"></span>Nearest you</div>' + row(t[0], true)
      + '<div class="hd2 q">The others</div>'
      + t.slice(1).map(function (x) { return row(x, false); }).join('') + '</div>'
      + '<div class="bar"><button><span class="g">&larr;</span>Board</button>'
      + '<span class="sp"></span><button>New trip</button></div>';
  }

  function ask() {
    return board().replace(/<div class="bar">/,
      '<div class="ask"><span class="k">Open on the right trip</span>'
      + '<p>You have three trips saved. If the app can see where you are, it opens on the one you are standing near.</p>'
      + '<div class="acts"><button>Use my location</button><button class="q">Not now</button></div></div>'
      + '<div class="bar" style="display:none">');
  }

  app.innerHTML = m.screen === 'trips' ? trips() : m.screen === 'ask' ? ask() : board();
})();
</script>
</body></html>
