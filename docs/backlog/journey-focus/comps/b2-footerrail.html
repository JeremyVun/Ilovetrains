<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2 · Footer rail</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="detail.css">
<style>
/* B2 · FOOTER RAIL — the focused journey is a board row that has moved to the
   bottom edge, under the masthead's own heavy rule printed a second time. It
   sits in thumb reach, it ABSORBS the freshness footer rather than adding to
   it, and it is loud: the minutes-to-go figure is set at the board's own
   secondary figure size, so the answer "you get there at 10:08, in 47 minutes"
   is the second thing on the screen after the next departure.
   Everything above it is the shipped board, untouched. */

.rail {
  flex: none; padding: 0 22px;
  border-top: 2px solid var(--ink);
}
.rail .r {
  display: grid; grid-template-columns: 86px 1fr; gap: 0 16px;
  align-items: start; padding: 16px 0 4px 12px; position: relative;
}
/* No colour stem: the heavy rule already says this band is not the board, and
   a second coloured stem on a screen that already has one on the lead row
   spends the accent twice. */
.rail .fig {
  font-size: 44px; font-weight: 250; letter-spacing: -0.045em; line-height: .84;
  color: var(--ink); text-align: right; padding-top: 2px;
}
.rail .fig .prov {
  display: block; margin-top: 9px; font-size: 10px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
}
.rail .dep { font-size: 20px; }
.rail .meta { margin-top: 9px; }
.rail .meta b { color: var(--ink-2); }
.rail .dest { margin-top: 7px; }
.rail .ftr { padding: 8px 0 18px; }
@media (max-width: 375px) { .rail { padding-left: 18px; padding-right: 18px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="onboard.js"></script>
<script>
(function () {
  var m = model();
  if (m.name === 'onboard') {
    document.getElementById('app').innerHTML = onboardDetailHtml(m);
    return;
  }
  var j = m.focus, now = m.now;
  var b = j.legs[1];
  var eff = function (l, w) { return l[w + 'Est'] === null ? l[w + 'Sched'] : l[w + 'Est']; };
  var depTH = eff(b, 'dep');
  var toGo = minsBetween(now, j.arrMs);
  var departed = minsBetween(now, j.depMs) < 0;
  var tight = j.changeMin < j.printedChangeMin && j.cancelledLeg !== 1;
  var broken = j.cancelledLeg === 1;

  /* Three lines, and every one of them fits the 232px body column at 390px:
     the rail is a glance, and a truncated glance is not one. */
  var meta = departed
    ? 'On board <b>' + esc(j.legs[0].line.code) + '</b> &nbsp;·&nbsp; 1 change'
    : 'The <b>' + clock(j.depMs) + '</b> &nbsp;·&nbsp; 1 change';

  var third = tight
    ? '<div class="dest note">' + j.changeMin + ' min to change · Town Hall</div>'
    : broken
      ? '<div class="dest note">' + esc(b.note) + '</div>'
      : '<div class="dest">Change ' + clock(depTH) + ' &nbsp;·&nbsp; Platform 5</div>';

  var rail =
    '<div class="rail' + (tight || broken ? ' warn' : '') + '">' +
      '<div class="r">' +
        '<div class="fig">' + toGo + '<span class="prov">min to go</span></div>' +
        '<div class="body">' +
          '<div class="dep"><strong>' + clock(j.arrMs) + '</strong>' +
            (broken ? '<del>' + clock(j.arrSchedMs) + '</del>' : '') +
            '<span class="to">arrives Bondi Junction</span></div>' +
          '<div class="meta">' + meta + '</div>' + third +
        '</div>' +
      '</div>' +
      '<div class="ftr"><span class="pulse live"></span>Updated 4s ago</div>' +
    '</div>';

  document.getElementById('app').innerHTML =
    boardMastHtml() + boardHtml(m) + rail;
})();
</script>
</body>
</html>
