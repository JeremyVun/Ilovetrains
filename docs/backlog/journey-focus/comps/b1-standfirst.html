<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B1 · Standfirst</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="detail.css">
<style>
/* B1 · STANDFIRST — the focused journey is a dek: it lives INSIDE the
   masthead, between the tools and the heavy rule, in the slot an editorial
   page keeps for the standfirst. It is the quietest of the three: the board is
   still the screen, and the focus is a line of type about it. It is also the
   only one that costs the board nothing structurally — no new region, no new
   edge — just the ~44px a line of standfirst takes. */

.strip {
  display: flex; align-items: baseline; gap: 12px;
  padding: 13px 0 15px; margin-top: 2px;
  border-top: 1px solid var(--rule);
}
.strip .lbl { flex: none; }
.strip .fact { margin-left: auto; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.strip .t { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; color: var(--ink); }
.strip .go { font-size: 15px; font-weight: 300; color: var(--ink-2); }
.strip .go b { color: var(--ink); font-weight: 400; }
.strip.warn .lbl { color: var(--warn); }
.strip .chev { color: var(--ink-3); font-size: 15px; padding-left: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="onboard.js"></script>
<script>
(function () {
  var m = model();
  if (m.name === 'onboard') {
    document.getElementById('app').innerHTML = onboardDetailHtml(m);
    return;
  }
  var j = m.focus, now = m.now;
  var toGo = minsBetween(now, j.arrMs);
  var departed = minsBetween(now, j.depMs) < 0;
  var tight = j.changeMin < j.printedChangeMin && j.cancelledLeg !== 1;
  var broken = j.cancelledLeg === 1;

  var label = departed ? 'On this train' : 'Focused · the ' + clock(j.depMs);
  if (tight) label = departed ? 'On this train · tight change' : 'Focused · tight change';
  if (broken) label = departed ? 'On this train · leg cancelled' : 'Focused · leg cancelled';

  var strip =
    '<div class="strip' + (tight || broken ? ' warn' : '') + '">' +
      '<span class="lbl">' + esc(label) + '</span>' +
      '<span class="fact"><span class="t">' + clock(j.arrMs) + '</span>' +
        '<span class="go"><b>' + toGo + '</b> min to go</span>' +
        '<span class="chev">→</span></span>' +
    '</div>';

  document.getElementById('app').innerHTML =
    boardMastHtml(strip) + boardHtml(m) + footerHtml();
})();
</script>
</body>
</html>
