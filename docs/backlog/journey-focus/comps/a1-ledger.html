<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 · Ledger</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="detail.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
(function () {
  var m = model();
  var j = m.focus;
  var now = m.now;
  var L = m.long;

  function legBlock(leg, i) {
    var dep = leg.depEst === null ? leg.depSched : leg.depEst;
    var arr = leg.arrEst === null ? leg.arrSched : leg.arrEst;
    var mins = minsBetween(now, dep);
    var f = figureFor(mins);
    var late = leg.lateMin > 0;
    var replaced = !!leg.note;

    var prov = late ? leg.lateMin + ' MIN LATE' : (leg.realtime ? f.prov : 'SCHEDULED');
    var cls = ['row', i === 0 ? 'first' : '', f.fig.length >= 3 ? 'wide' : '',
      late ? 'late' : '', leg.realtime ? '' : 'sched'].filter(Boolean).join(' ');

    var depLine = '<strong>' + clock(dep) + '</strong>';
    if (late) depLine += '<del>' + clock(leg.depSched) + '</del>';
    if (replaced) depLine += '<del>' + leg.replacedTime + '</del>';
    depLine += '<span class="to">arrives ' + clock(arr) + '</span>';

    var third = replaced
      ? '<div class="dest note">' + esc(leg.note) + '</div>'
      : '<div class="dest">' + esc(L ? leg.line.full : leg.line.name) + ' to ' + esc(leg.line.headsign) + '</div>';

    return '<div class="' + cls + '" style="--stem:var(--line-' + leg.line.code + ')">' +
      '<div class="mins">' + esc(f.fig) + '<span class="prov' + (late ? ' warn' : '') + '">' + esc(prov) + '</span></div>' +
      '<div class="body">' +
        '<div class="dep">' + depLine + '</div>' +
        '<div class="meta">Platform <b>' + leg.from.platform.replace('Platform ', '') + '</b>' +
          '<span class="badge">' + esc(leg.line.code) + '</span></div>' +
        third +
      '</div></div>';
  }

  function changeBlock() {
    var a = j.legs[0], b = j.legs[1];
    var arr = a.arrEst === null ? a.arrSched : a.arrEst;
    var dep = b.depEst === null ? b.depSched : b.depEst;
    var tight = j.changeMin < j.printedChangeMin && j.cancelledLeg !== 1;

    var line3 = 'Arrive ' + clock(arr) +
      (tight ? ' <del>' + clock(a.arrSched) + '</del>' : '') +
      ' &nbsp;·&nbsp; leave ' + clock(dep) +
      (j.cancelledLeg === 1 ? ' <del>' + b.replacedTime + '</del>' : '');

    /* Two times and the two windows. No claim about whether you make it —
       that is a prediction this app has no data to support. */
    var warn = tight
      ? '<div class="warnline">Printed change was ' + j.printedChangeMin + ' min</div>' : '';

    return '<div class="row chg' + (tight ? ' tight' : '') + '">' +
      '<div class="mins">' + j.changeMin +
        '<span class="prov">to change</span></div>' +
      '<div class="body">' +
        '<h2>' + esc(L ? 'Town Hall Station' : 'Town Hall') + '</h2>' +
        '<div class="meta">Platform <b>3</b><span class="arw">→</span>Platform <b>5</b></div>' +
        '<div class="dest">' + line3 + '</div>' + warn +
      '</div></div>';
  }

  var lede = '1 change at Town Hall &nbsp;·&nbsp; arrives ' + clock(j.arrMs) +
    (j.cancelledLeg === 1 ? ' <del>' + clock(j.arrSchedMs) + '</del>' : '');

  var end = j.legs[1].to;
  document.getElementById('app').innerHTML =
    '<div class="mast">' +
      '<div class="kicker"><span class="lbl">Journey</span></div>' +
      '<h1>' + esc(L ? 'Rhodes Station' : 'Rhodes') + ' <em>→</em> ' + esc(L ? 'Bondi Junction Station' : 'Bondi Junction') + '</h1>' +
      '<div class="lede">' + lede + '</div>' +
      '<div class="tools"><button>Board</button><button class="on">Focus this train</button></div>' +
      '<div class="rule"></div>' +
    '</div>' +
    '<div class="legs">' +
      legBlock(j.legs[0], 0) + changeBlock() + legBlock(j.legs[1], 1) +
    '</div>' +
    '<div class="tail"><div class="rule"></div><div class="line">' +
      '<span class="t">' + clock(j.arrMs) + '</span>' +
      '<span class="n">' + esc(L ? end.station : end.name) + '</span>' +
      '<span class="lbl p">Platform ' + end.platform.replace('Platform ', '') + '</span>' +
    '</div></div>' +
    footerHtml();
})();
</script>
</body>
</html>
