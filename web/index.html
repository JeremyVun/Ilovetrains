<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<!-- Without this, Chrome lays a "mobile" page out at 980px and scales it down:
     every mobile screenshot becomes a lie. See tools/screenshot.js. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The appearance bootstrap updates browser chrome before the stylesheet and
     app body paint. -->
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0B0D">
<meta name="description" content="Your next Sydney train, before you ask.">
<title>ilovetrains</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ilovetrains">
<script src="/js/appearance.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/js/main.js"></script>
<!-- Registered after load, and inline, so nothing about the service worker
     sits between a cold open and the board. See web/sw.js. -->
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('sw', e));
  });
}
</script>
</body>
</html>
